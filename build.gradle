plugins {
    id 'java'
}

version = '1.0.2'
group = 'org.lwjgl.natives'

base {
    archivesName = 'lwjgl-nanovg-natives'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from('src/main/resources')
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from('src/main/resources')
    from(rootDir) {
        include 'build.gradle', 'settings.gradle', 'README.md', '.gitignore'
    }
}

tasks.register('buildJars') {
    dependsOn tasks.named('jar'), tasks.named('sourcesJar')
}
